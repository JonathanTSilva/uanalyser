[project]
name = "opcua-traffic-analyser"
version = "0.1.0"
description = "Traffic analyser for intrusion detection in OPC UA networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonathan T. Silva" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "scapy>=2.5.0",
    "scikit-learn>=1.4.1",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "plotly>=5.20.0",
    "pyshark>=0.6",
    "typer>=0.9.0",
    "rich>=13.7.1",
]

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "pytest-cov"]
docs = [
    "mkdocs-material>=9.5.13",
    "mkdocstrings>=0.24.1",
    "mkdocstrings-python>=1.9.0",
]

[tool.uv]
# A research script collection, not an installable package: run it from the checkout.
package = false

[tool.pytest.ini_options]
pythonpath = [".", "uanalyser"]
testpaths = ["tests", "uanalyser"]
addopts = "--doctest-modules --cov=uanalyser"

[tool.coverage.run]
source = ["uanalyser"]

[tool.ruff]
line-length = 79
extend-exclude = ["Data"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["uanalyser", "tests"]
# Legacy research code, untyped helpers. Basic for now; strict is tracked in issue #6.
typeCheckingMode = "basic"
extraPaths = ["uanalyser"]
